<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Car Scorer">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Car Taste Scoring Board</title>
<style>
:root{--bg:#f4f1eb;--card:#fffdf9;--ink:#1e1c19;--muted:#756f66;--line:#d8d1c5;--accent:#66513d;--soft:#eee7dc}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:rgba(244,241,235,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top)) 14px 14px}
.wrap{max-width:860px;margin:0 auto}
h1{margin:0 0 4px;font-size:24px}
header p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
button{font:inherit}
.action{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:10px 12px;font-weight:700;font-size:14px}
.action.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#installHint{display:none;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:13px}
main{padding:16px 10px 70px}
.grid{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 4px 18px rgba(60,45,30,.05)}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.group{color:#a07a56;font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.12em}
h2{margin:5px 0 6px;font-size:21px;line-height:1.15}
.spec{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.overall-badge{min-width:58px;height:58px;padding:0 7px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:850;font-size:18px;text-align:center}
.overall-badge small{display:block;font-size:9px;font-weight:750;color:var(--muted);line-height:1}
.links{display:flex;gap:8px;margin:14px 0}
.links a{color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:9px 11px;border-radius:10px;font-size:13px;font-weight:750;background:white}
.decision-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 0;margin-bottom:14px;font-size:14px;font-weight:750}
select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:white;font:inherit}
.criterion{margin:15px 0 18px}
.criterion-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.criterion-title{font-size:16px;font-weight:760}
.criterion-score{font-size:17px;font-weight:850}
.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.score-btn{height:44px;border:2px solid transparent;border-radius:10px;color:#fff;font-size:16px;font-weight:850;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);touch-action:manipulation}
.score-btn.selected{border-color:#1e1c19;box-shadow:0 0 0 2px #fff inset,0 1px 5px rgba(0,0,0,.18);transform:translateY(-1px)}
.scale-caption{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:11px}
.notes-label{display:block;font-size:14px;font-weight:800;margin-top:8px}
textarea{width:100%;min-height:78px;resize:vertical;margin-top:7px;border:1px solid var(--line);background:white;border-radius:12px;padding:11px;font:inherit;font-size:14px}
.summary-box{margin-top:22px;background:#211d19;color:#f7f2e8;border-radius:18px;padding:16px}
.summary-box h2{margin-top:0}
.summary-box textarea{min-height:250px;background:#15120f;color:#f7f2e8;border-color:#3f352d;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.small{color:#beb3a8;font-size:12px}
@media(min-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<div class="wrap">
<h1>Car Taste Scoring Board</h1>
<p>Tap a score from 1–10. Overall is calculated automatically from Exterior, Road presence, Interior and Uniqueness.</p>
<div class="toolbar">
<button class="action primary" onclick="copySummary()">Copy feedback</button>
<button class="action" onclick="sortCards('overall')">Sort by overall</button>
<button class="action" onclick="sortCards('name')">Sort A–Z</button>
<button class="action" onclick="resetAll()">Reset all</button>
</div>
<div id="installHint">In Safari: <strong>Share → Add to Home Screen → Open as Web App</strong>.</div>
</div>
</header>
<main class="wrap">
<div class="grid" id="grid"></div>
<section class="summary-box">
<h2>Paste this back to ChatGPT</h2>
<p class="small">Your notes and scores are saved on this device.</p>
<textarea id="summary" readonly></textarea>
<div class="toolbar"><button class="action primary" onclick="copySummary()">Copy feedback</button></div>
</section>
</main>
<script>
const cars=[{"name":"Lexus LS 600h L","group":"Japanese","spec":"Rear Seat Relaxation • Ivory / Parchment • Walnut"},{"name":"Toyota Crown Majesta Hybrid","group":"Japanese","spec":"F Version • cream leather • wood"},{"name":"Toyota Century G50","group":"Japanese","spec":"V12 • wool or pale leather • extensive wood"},{"name":"Lexus SC430","group":"Japanese","spec":"Ecru / Ivory leather • wood • Mark Levinson"},{"name":"Lexus GS450h Luxury","group":"Japanese","spec":"Luxury / Premier • Ivory / cream • wood"},{"name":"Jaguar XJ / XJL X351","group":"Jaguar / Daimler","spec":"Portfolio / Autobiography • Ivory / London Tan • walnut"},{"name":"Jaguar XK X150","group":"Jaguar / Daimler","spec":"5.0 Portfolio • Ivory • walnut"},{"name":"Daimler Super Eight X358","group":"Jaguar / Daimler","spec":"Ivory hide • traditional walnut • supercharged V8"},{"name":"Mercedes SL500 R230","group":"Mercedes","spec":"Cream / beige • wood"},{"name":"Mercedes CL500 C216","group":"Mercedes","spec":"Beige / cream leather • Burr Walnut • wood/leather wheel"},{"name":"Mercedes S500L W221","group":"Mercedes","spec":"Sahara / Savanna beige • Burr Walnut • rear comfort equipment"},{"name":"Bentley Continental GT","group":"Bentley","spec":"Mulliner • pale leather • Burr Walnut"},{"name":"Bentley Flying Spur","group":"Bentley","spec":"Mulliner • pale leather • Burr Walnut"},{"name":"Volkswagen Phaeton","group":"German","spec":"W12 / 4.2 V8 • ideally LWB / 4-seat"},{"name":"Audi A8L D4","group":"German","spec":"Comfort / Executive seats • beige Valcona • walnut"},{"name":"BMW 750Li / 760Li F02","group":"German","spec":"BMW Individual • Champagne / Oyster • Walnut"},{"name":"Chrysler 300C HEMI","group":"Other","spec":"5.7 V8 • Luxury Pack • walnut"},{"name":"Genesis Electrified G80","group":"Other","spec":"Luxury • pale Nappa • wood"}];
const criteria=[
 {key:"exterior",label:"Exterior"},
 {key:"presence",label:"Road presence"},
 {key:"interior",label:"Interior"},
 {key:"unique",label:"Uniqueness"}
];
const KEY="carTasteScoring-v2";
const OLD_KEY="carTasteScoring-v1";

function scoreColour(n){
 const hue=Math.round((n-1)*(120/9));
 const light=n===5||n===6?42:38;
 return "hsl("+hue+" 66% "+light+"%)";
}
function googleUrl(name,images){
 const q=encodeURIComponent(name+(images?" exterior interior":" UK for sale"));
 return images ? "https://www.google.com/search?tbm=isch&q="+q : "https://www.google.com/search?q="+q;
}
function emptyData(){return {scores:{exterior:0,presence:0,interior:0,unique:0},decision:"",notes:""}}
function loadStore(){
 let d={};
 try{d=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
 if(Object.keys(d).length) return d;
 let old={};
 try{old=JSON.parse(localStorage.getItem(OLD_KEY)||"{}")}catch(e){}
 if(Object.keys(old).length){
   const migrated={};
   cars.forEach((_,i)=>{
     const o=old[i]||{};
     const s=o.scores||{};
     const interiorBits=[s.interior,s.trim,s.seats,s.gadgets].filter(v=>Number(v)>0).map(Number);
     migrated[i]={
       scores:{
         exterior:Number(s.exterior)||0,
         presence:Number(s.presence)||0,
         interior:interiorBits.length?Math.round(interiorBits.reduce((a,b)=>a+b,0)/interiorBits.length):0,
         unique:Number(s.unique)||0
       },
       decision:o.decision||"",
       notes:o.notes||""
     };
   });
   localStorage.setItem(KEY,JSON.stringify(migrated));
   return migrated;
 }
 return {};
}
let store=loadStore();

function overallFor(i){
 const s=(store[i]||emptyData()).scores;
 const vals=criteria.map(c=>Number(s[c.key])||0).filter(v=>v>0);
 return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
}
function render(){
 const grid=document.getElementById("grid");
 grid.innerHTML="";
 cars.forEach((car,i)=>{
   const d=store[i]||emptyData();
   const article=document.createElement("article");
   article.className="card";
   article.dataset.carCard=i;
   const overall=overallFor(i);
   let criterionHtml="";
   criteria.forEach(c=>{
     const value=Number(d.scores[c.key])||0;
     let buttons="";
     for(let n=1;n<=10;n++){
       buttons+='<button type="button" class="score-btn'+(value===n?' selected':'')+'" style="background:'+scoreColour(n)+'" onclick="setScore('+i+',\''+c.key+'\','+n+')" aria-label="'+c.label+' '+n+' out of 10">'+n+'</button>';
     }
     criterionHtml+='<div class="criterion"><div class="criterion-head"><span class="criterion-title">'+c.label+'</span><span class="criterion-score">'+(value||"—")+'</span></div><div class="score-grid">'+buttons+'</div><div class="scale-caption"><span>1 — dislike</span><span>10 — love</span></div></div>';
   });
   article.innerHTML=
    '<div class="card-top"><div><div class="group">'+car.group+'</div><h2>'+car.name+'</h2><p class="spec">'+car.spec+'</p></div>'+
    '<div class="overall-badge"><div>'+(overall?overall.toFixed(1):"—")+'<small>OVERALL</small></div></div></div>'+
    '<div class="links"><a href="'+googleUrl(car.name,false)+'" target="_blank" rel="noopener external">Google search</a><a href="'+googleUrl(car.name,true)+'" target="_blank" rel="noopener external">Images</a></div>'+
    '<div class="decision-row"><label>Would I actually consider it?</label><select onchange="setDecision('+i+',this.value)"><option value="">—</option><option'+(d.decision==="Yes"?" selected":"")+'>Yes</option><option'+(d.decision==="Maybe"?" selected":"")+'>Maybe</option><option'+(d.decision==="No"?" selected":"")+'>No</option></select></div>'+
    criterionHtml+
    '<label class="notes-label">Notes / instant reaction<textarea placeholder="e.g. love the interior, exterior too anonymous…" oninput="setNotes('+i+',this.value)">'+escapeHtml(d.notes||"")+'</textarea></label>';
   grid.appendChild(article);
 });
 renderSummary();
}
function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function ensure(i){if(!store[i])store[i]=emptyData()}
function persist(){localStorage.setItem(KEY,JSON.stringify(store))}
function setScore(i,key,n){ensure(i);store[i].scores[key]=n;persist();render()}
function setDecision(i,v){ensure(i);store[i].decision=v;persist();renderSummary()}
function setNotes(i,v){ensure(i);store[i].notes=v;persist();renderSummary()}
function renderSummary(){
 const lines=["CAR TASTE FEEDBACK","Scale: 1–10. Overall = automatic mean of Exterior, Road presence, Interior and Uniqueness.",""];
 cars.forEach((car,i)=>{
   const d=store[i]||emptyData();
   const has=criteria.some(c=>Number(d.scores[c.key])>0)||d.decision||d.notes;
   if(!has)return;
   lines.push("## "+car.name);
   if(d.decision)lines.push("Consider: "+d.decision);
   const bits=criteria.filter(c=>Number(d.scores[c.key])>0).map(c=>c.label+" "+d.scores[c.key]);
   if(bits.length)lines.push(bits.join(" | "));
   const ov=overallFor(i);
   if(ov)lines.push("Overall "+ov.toFixed(1));
   if(d.notes)lines.push("Notes: "+d.notes.trim());
   lines.push("");
 });
 if(lines.length===3)lines.push("No cars scored yet.");
 document.getElementById("summary").value=lines.join("\n");
}
async function copySummary(){
 renderSummary();
 const txt=document.getElementById("summary").value;
 try{await navigator.clipboard.writeText(txt);alert("Feedback copied.");}
 catch(e){const box=document.getElementById("summary");box.focus();box.select();document.execCommand("copy");alert("Feedback copied.");}
}
function sortCards(mode){
 const grid=document.getElementById("grid");
 const nodes=[...grid.children];
 nodes.sort((a,b)=>{
   const ia=Number(a.dataset.carCard),ib=Number(b.dataset.carCard);
   if(mode==="name")return cars[ia].name.localeCompare(cars[ib].name);
   return overallFor(ib)-overallFor(ia);
 });
 nodes.forEach(n=>grid.appendChild(n));
}
function resetAll(){
 if(!confirm("Clear every score and note?"))return;
 store={};localStorage.removeItem(KEY);render();
}
const standalone=window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
if(!standalone)document.getElementById("installHint").style.display="block";
render();
</script>
</body>
</html>
